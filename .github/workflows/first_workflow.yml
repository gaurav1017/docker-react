name: Multiple Events
on: push
jobs:
  lint:
   runs-on: ubuntu-latest
   steps: 
    - name: checkout code
      uses: actions/checkout@v4

    - name: install dependences
      run: npm install
    - name: run lint
      run: npm run lint
  node_test:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: checkout code
      uses: actions/checkout@v4

    - name: install dependences
      run: npm install
    - name: run test
      run: npm run test
  deploy:
    needs: node_test 
    runs-on: ubuntu-latest
    steps:
    - name: checkout code
      uses: actions/checkout@v4

    - name: install NodeJs
      uses: actions/setup-node@v4
      with:
        node-version: "22"
    - name: install dependences
      run:  npm ci
    - name: build project
      run: npm run build
    - name: upload artifacts
      uses: actions/upload-artifact@v4
      with: 
        name: package file only
        path: |
           src/asset
           package.json
      package.json    
    - name: deploy
      run: echo "Deploying..."        

 