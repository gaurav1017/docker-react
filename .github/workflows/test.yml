name: test project
on: push
jobs:
  test: 
   runs-on: ubuntu-latest
   steps: 
   - name: Checkout code
     uses: actions/checkout@v4
   - name: Install dependencies
     run: npm install
   - name: Run tests
     run: npm run test
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install NodeJS
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      run: npm ci
      name: Build Project
      run: npm run build
    - name: Deploy
      run: echo "Deploying ..."
