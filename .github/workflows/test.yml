name: test project
on: push
jobs:
  test: 
   runs-on: ubuntu-latest
   steps: 
   - name: Checkout code
     uses: actions/checkout@v4
   - name: Install dependencies
     run: npm install
   - name: Run tests
     run: npm run test
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install dependencies
      run: npm install
    - name: Run tests
      run: npm run test
    - name: Deploy
      run: npm run build
      